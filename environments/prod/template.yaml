AWSTemplateFormatVersion: "2010-09-09"
Description: "Day One - Prod (ECS on EC2 + CloudFront + Route53)"

Parameters:
  VPCId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC ID from dev stack

  InternetGatewayId:
    Type: String
    Description: Existing Internet Gateway ID from dev stack

  HostedZoneId:
    Type: String
    Default: Z0139404KXA76HC92RHI
    Description: Route 53 Hosted Zone ID for dayone01.site

  LatestECSAMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id
    Description: Latest ECS-optimized AMI

Resources:
  # ============================================================
  # Networking
  # ============================================================
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPCId
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: us-east-1b
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: day-one-prod-public

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPCId
      Tags:
        - Key: Name
          Value: day-one-prod-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGatewayId

  PublicSubnetRTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # ============================================================
  # Security Group
  # ============================================================
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Prod EC2 - HTTP from CloudFront + SSH
      VpcId: !Ref VPCId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP from CloudFront
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH
      Tags:
        - Key: Name
          Value: day-one-prod-ec2-sg

  # ============================================================
  # ACM Certificate (auto-validated via Route 53)
  # ============================================================
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: dayone01.site
      SubjectAlternativeNames:
        - "*.dayone01.site"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: dayone01.site
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: Name
          Value: day-one-prod-cert

  # ============================================================
  # IAM - EC2 Instance Role (ECS agent + ECR)
  # ============================================================
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: day-one-prod-ec2-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
      Tags:
        - Key: Name
          Value: day-one-prod-ec2-role

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  # ============================================================
  # EC2 Instance (ECS-optimized)
  # ============================================================
  EC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestECSAMI
      InstanceType: t2.small
      KeyName: Day-One-Keypair
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      IamInstanceProfile: !Ref EC2InstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo ECS_CLUSTER=day-one-prod >> /etc/ecs/ecs.config
          mkdir -p /data/mysql
          chown 999:999 /data/mysql
      Tags:
        - Key: Name
          Value: day-one-prod-ec2

  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: day-one-prod-eip

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref EC2Instance
      AllocationId: !GetAtt ElasticIP.AllocationId

  # ============================================================
  # Route 53 - origin subdomain (stable CloudFront origin)
  # ============================================================
  OriginDNSRecord:
    Type: AWS::Route53::RecordSet
    DependsOn: EIPAssociation
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: origin.dayone01.site
      Type: A
      TTL: 60
      ResourceRecords:
        - !Ref ElasticIP

  # ============================================================
  # CloudFront Distribution
  # ============================================================
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn: OriginDNSRecord
    Properties:
      DistributionConfig:
        Enabled: true
        Aliases:
          - dayone01.site
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultCacheBehavior:
          TargetOriginId: ec2-origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ec2-origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
        Origins:
          - Id: ec2-origin
            DomainName: origin.dayone01.site
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        HttpVersion: http2
      Tags:
        - Key: Name
          Value: day-one-prod-cf

  # ============================================================
  # Route 53 - main domain → CloudFront
  # ============================================================
  DNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: dayone01.site
      Type: A
      AliasTarget:
        DNSName: !GetAtt CloudFrontDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # ============================================================
  # ECR Repositories (already exist - created outside this stack)
  # day-one-prod/backend, day-one-prod/frontend
  # ============================================================

  # ============================================================
  # Secrets Manager (App + DB secrets)
  # ============================================================
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: first_button_prod
      Description: Day One prod - DB and app secrets
      SecretString: |
        {
          "MYSQL_ROOT_PASSWORD": "CHANGE_ME",
          "MYSQL_DATABASE": "firstbutton",
          "MYSQL_USER": "CHANGE_ME",
          "MYSQL_PASSWORD": "CHANGE_ME",
          "GOOGLE_GEMINI_API": "CHANGE_ME",
          "GOOGLE_CLIENT_ID": "CHANGE_ME",
          "GOOGLE_CLIENT_SECRET": "CHANGE_ME"
        }

  # ============================================================
  # ECS Cluster
  # ============================================================
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: day-one-prod
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  # ============================================================
  # CloudWatch Log Groups
  # ============================================================
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/day-one-prod/backend
      RetentionInDays: 14

  FrontendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/day-one-prod/frontend
      RetentionInDays: 14

  # ============================================================
  # IAM - ECS Task Execution Role (secrets + logs)
  # ============================================================
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: day-one-prod-ecs-execution-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:first_button_*"

  # ============================================================
  # IAM - ECS Task Role (runtime: S3)
  # ============================================================
  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: day-one-prod-ecs-task-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource: "*"

  # ============================================================
  # ECS Task Definition (Nginx + Backend + MySQL in one task)
  # ============================================================
  AppTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: day-one-prod-app
      NetworkMode: host
      RequiresCompatibilities:
        - EC2
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      Volumes:
        - Name: mysql-data
          Host:
            SourcePath: /data/mysql
      ContainerDefinitions:
        # --- MySQL (port 3306) ---
        - Name: mysql
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/day-one-prod/mysql:latest"
          Essential: true
          Memory: 512
          MemoryReservation: 384
          MountPoints:
            - SourceVolume: mysql-data
              ContainerPath: /var/lib/mysql
          Secrets:
            - Name: MYSQL_ROOT_PASSWORD
              ValueFrom: !Sub "${AppSecret}:MYSQL_ROOT_PASSWORD::"
            - Name: MYSQL_DATABASE
              ValueFrom: !Sub "${AppSecret}:MYSQL_DATABASE::"
            - Name: MYSQL_USER
              ValueFrom: !Sub "${AppSecret}:MYSQL_USER::"
            - Name: MYSQL_PASSWORD
              ValueFrom: !Sub "${AppSecret}:MYSQL_PASSWORD::"
          HealthCheck:
            Command:
              - CMD-SHELL
              - mysqladmin ping -h localhost
            Interval: 10
            Timeout: 5
            Retries: 5
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: mysql

        # --- Backend / FastAPI (port 8000) ---
        - Name: backend
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/day-one-prod/backend:latest"
          Essential: true
          Memory: 512
          MemoryReservation: 384
          DependsOn:
            - ContainerName: mysql
              Condition: HEALTHY
          Environment:
            - Name: DB_HOST
              Value: localhost
            - Name: DB_PORT
              Value: "3306"
            - Name: AWS_REGION
              Value: !Ref "AWS::Region"
            - Name: BASE_URL
              Value: "https://dayone01.site"
          Secrets:
            - Name: DB_NAME
              ValueFrom: !Sub "${AppSecret}:MYSQL_DATABASE::"
            - Name: DB_USER
              ValueFrom: !Sub "${AppSecret}:MYSQL_USER::"
            - Name: DB_PASSWORD
              ValueFrom: !Sub "${AppSecret}:MYSQL_PASSWORD::"
            - Name: GOOGLE_GEMINI_API
              ValueFrom: !Sub "${AppSecret}:GOOGLE_GEMINI_API::"
            - Name: GOOGLE_CLIENT_ID
              ValueFrom: !Sub "${AppSecret}:GOOGLE_CLIENT_ID::"
            - Name: GOOGLE_CLIENT_SECRET
              ValueFrom: !Sub "${AppSecret}:GOOGLE_CLIENT_SECRET::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: backend

        # --- Frontend / Nginx (port 80) ---
        - Name: frontend
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/day-one-prod/frontend:latest"
          Essential: true
          Memory: 128
          MemoryReservation: 64
          DependsOn:
            - ContainerName: backend
              Condition: START
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref FrontendLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: frontend

  # ============================================================
  # ECS Service
  # ============================================================
  AppService:
    Type: AWS::ECS::Service
    DependsOn: EC2Instance
    Properties:
      ServiceName: app
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref AppTaskDefinition
      DesiredCount: 1
      LaunchType: EC2

Outputs:
  EC2PublicIP:
    Description: EC2 Elastic IP
    Value: !Ref ElasticIP

  CloudFrontDomain:
    Description: CloudFront domain (dayone01.site → this)
    Value: !GetAtt CloudFrontDistribution.DomainName

  CloudFrontDistributionId:
    Description: CloudFront Distribution ID
    Value: !Ref CloudFrontDistribution

  AppSecretArn:
    Description: App secrets ARN (update CHANGE_ME values!)
    Value: !Ref AppSecret

  BackendECRUri:
    Description: Backend ECR Repository URI
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/day-one-prod/backend"

  FrontendECRUri:
    Description: Frontend ECR Repository URI
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/day-one-prod/frontend"

  SiteURL:
    Description: Production URL
    Value: "https://dayone01.site"
