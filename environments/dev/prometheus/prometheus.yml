scrape_configs:
  - job_name: 'dev-backend'
    scrape_interval: 5s
    scrape_timeout: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:9091']

  - job_name: 'prod-backend'
    scrape_interval: 5s
    scrape_timeout: 5s
    metrics_path: /metrics
    static_configs:
      - targets: ['10.0.2.248:9091']
